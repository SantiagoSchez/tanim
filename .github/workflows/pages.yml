# Publishes the web version of the animations (tanim --export-html) to GitHub
# Pages on every push to main, with the Stream Deck GIFs from the
# gh-pages-assets branch (`make streamdeck-publish`) served at streamdeck/.
name: Deploy web version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build tanim (build.rs compiles the WebAssembly module)
        run: cargo build --release
      - name: Export the web pages
        run: ./target/release/tanim --export-html site
      - name: Add the Stream Deck GIFs
        uses: actions/checkout@v7
        with:
          ref: gh-pages-assets
          path: site/streamdeck
          persist-credentials: false
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
