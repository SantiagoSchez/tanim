<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="icon" type="image/png" href="data:image/png;base64,__ICON__">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  #ui {
    position: fixed; top: 12px; left: 12px; max-width: calc(100vw - 84px);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #d4dae8;
    background: rgba(10, 12, 20, 0.75); border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px; padding: 8px 12px; backdrop-filter: blur(8px);
    transition: opacity 0.4s;
  }
  #ui.hidden { opacity: 0; pointer-events: none; }
  #ui select {
    font: inherit; color: inherit; background: #1b2030; border: 1px solid #3b4260;
    border-radius: 4px; padding: 1px 4px; margin-right: 6px;
  }
  #name { font-weight: bold; margin-right: 6px; }
  #hint { opacity: 0.65; }
  #top { display: flex; align-items: flex-start; gap: 12px; }
  #top > div { flex: 1; }
  #more {
    font: inherit; line-height: 1.2; color: inherit; background: #1b2030; border: 1px solid #3b4260;
    border-radius: 4px; padding: 0 7px; cursor: pointer;
  }
  #more:hover, #more[aria-expanded="true"] { background: #2a3150; }
  #menu {
    position: absolute; top: calc(100% + 6px); right: 0; min-width: 200px;
    background: rgba(10, 12, 20, 0.92); border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px; padding: 6px; backdrop-filter: blur(8px);
  }
  #menu .title { opacity: 0.65; padding: 0 6px 2px; }
  #menu a {
    display: flex; justify-content: space-between; gap: 16px; padding: 1px 6px;
    color: inherit; text-decoration: none; border-radius: 4px;
  }
  #menu a:hover, #menu a:focus-visible { background: #2a3150; outline: none; }
  #menu a span:last-child { opacity: 0.65; }
  #menu .note { opacity: 0.5; font-size: 11px; padding: 4px 6px 0; }
  #repo {
    position: fixed; top: 12px; right: 12px; line-height: 0; color: #fff; opacity: 0.4;
    filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.7)); transition: opacity 0.4s;
  }
  #repo:hover, #repo:focus-visible { opacity: 1; transition-duration: 0.15s; outline: none; }
  #repo.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<a id="repo" href="https://github.com/SantiagoSchez/tanim" target="_blank" rel="noopener" title="tanim on GitHub" aria-label="tanim on GitHub">
  <svg viewBox="0 0 16 16" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
</a>
<div id="ui">
  <div id="top">
    <div><select id="pick"></select><span id="name"></span><span id="desc"></span></div>
    <button id="more" type="button" title="Options" aria-label="Options" aria-haspopup="menu" aria-expanded="false" hidden>⋯</button>
  </div>
  <div id="hint"></div>
  <div id="menu" role="menu" hidden>
    <div class="title">Stream Deck GIF</div>
    <div id="decks"></div>
    <div class="note">Stream Deck → Preferences → Set Screensaver</div>
  </div>
</div>
<script>
// Generated by `tanim --export-html`: the animations run as WebAssembly (the
// same Rust code as the terminal version), drawn onto a canvas cell by cell.
const WASM = "__WASM__";
const START = "__START__"; // animation to show, or "" to pick from the URL hash
const SINGLE = __SINGLE__; // true: this page only shows START

(async () => {
  const bytes = Uint8Array.from(atob(WASM), (c) => c.charCodeAt(0));
  const { instance } = await WebAssembly.instantiate(bytes, {});
  const e = instance.exports;
  const text = (ptr, len) => new TextDecoder().decode(new Uint8Array(e.memory.buffer, ptr, len));
  const anims = [];
  for (let i = 0; i < e.count(); i++) {
    anims.push({ name: text(e.name_ptr(i), e.name_len(i)), desc: text(e.desc_ptr(i), e.desc_len(i)), fps: e.fps(i) });
  }

  const canvas = document.getElementById("screen");
  const ctx = canvas.getContext("2d", { alpha: false });
  const ui = document.getElementById("ui");
  const repo = document.getElementById("repo");
  const pick = document.getElementById("pick");
  const nameEl = document.getElementById("name");
  const descEl = document.getElementById("desc");
  const hintEl = document.getElementById("hint");
  const hint = (name) => (SINGLE ? "Enter: restart" : "Enter: another")
    + (name === "dungeon" ? " · Space: new dungeon" : "")
    + " · ↑/↓: zoom · WASD: pan · +/−: cell size · F: fullscreen";
  if (SINGLE) pick.style.display = "none";
  anims.forEach((a, i) => pick.add(new Option(a.name, i)));

  // Stream Deck screensavers, served next to the pages as
  // streamdeck/<model>/<name>.gif (`make streamdeck-publish`). The options
  // menu offers the ones that are there; with none (e.g. from disk) it hides.
  const DECKS = [["neo", "Neo", "480×320"], ["mk2", "MK.2", "480×272"], ["xl", "XL", "768×384"],
    ["plus", "Plus", "800×480"], ["plusxl", "Plus XL", "1280×800"]];
  const more = document.getElementById("more");
  const menu = document.getElementById("menu");
  const decksEl = document.getElementById("decks");
  const gifs = new Map(); // animation name -> promise of the DECKS it has a GIF for
  const gifsOf = (name) => {
    if (!gifs.has(name)) {
      const has = (m) => fetch(`streamdeck/${m}/${name}.gif`, { method: "HEAD" }).then((r) => r.ok, () => false);
      gifs.set(name, Promise.all(DECKS.map(([m]) => has(m))).then((ok) => DECKS.filter((_, i) => ok[i])));
    }
    return gifs.get(name);
  };
  function offerGifs(name) {
    more.hidden = true;
    decksEl.replaceChildren();
    gifsOf(name).then((decks) => {
      if (anims[cur].name !== name) return;
      for (const [m, label, size] of decks) {
        const a = document.createElement("a");
        a.href = `streamdeck/${m}/${name}.gif`;
        a.download = `tanim-${name}-${m}.gif`;
        a.setAttribute("role", "menuitem");
        a.append(Object.assign(document.createElement("span"), { textContent: "↓ " + label }),
          Object.assign(document.createElement("span"), { textContent: size }));
        decksEl.append(a);
      }
      more.hidden = decks.length === 0;
    });
  }
  function toggleMenu(open) {
    menu.hidden = !open;
    more.setAttribute("aria-expanded", String(open));
    if (open) decksEl.querySelector("a")?.focus();
    showUi();
  }

  const HEX = Array.from({ length: 256 }, (_, i) => i.toString(16).padStart(2, "0"));
  const css = (v) => "#" + HEX[(v >> 16) & 255] + HEX[(v >> 8) & 255] + HEX[v & 255];

  let cellCss = 8; // cell width in CSS pixels; cells are twice as tall
  let cur = 0, cols = 1, rows = 1, cw = 2, prev = null, acc = 0, last = 0;

  // Size the grid to the window. Cells are whole device pixels, twice as tall
  // as wide, so each half block is an exact square with no seams.
  function layout() {
    const dpr = window.devicePixelRatio || 1;
    cw = Math.max(2, Math.round(cellCss * dpr));
    cols = Math.max(1, Math.floor((innerWidth * dpr) / cw));
    rows = Math.max(1, Math.floor((innerHeight * dpr) / (2 * cw)));
    canvas.width = cols * cw;
    canvas.height = rows * 2 * cw;
    canvas.style.width = canvas.width / dpr + "px";
    canvas.style.height = canvas.height / dpr + "px";
    ctx.font = `${Math.round(cw * 1.6)}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
  }

  function play(i) {
    cur = i;
    layout();
    prev = null;
    acc = 0;
    e.start(i, cols, rows, Math.floor(Math.random() * 2 ** 52));
    pick.value = String(i);
    nameEl.textContent = SINGLE ? anims[i].name : "";
    descEl.textContent = anims[i].desc;
    hintEl.textContent = hint(anims[i].name);
    document.title = "tanim · " + anims[i].name;
    if (!SINGLE) history.replaceState(null, "", "#" + anims[i].name);
    if (!menu.hidden) toggleMenu(false);
    offerGifs(anims[i].name);
  }

  function cell(c, fg, bg, x, y) {
    const w = cw, h = 2 * cw;
    ctx.fillStyle = css(bg);
    ctx.fillRect(x, y, w, h);
    if (c === 0x20) return;
    ctx.fillStyle = css(fg);
    switch (c) {
      case 0x2580: ctx.fillRect(x, y, w, cw); return; // ▀
      case 0x2584: ctx.fillRect(x, y + cw, w, cw); return; // ▄
      case 0x2588: ctx.fillRect(x, y, w, h); return; // █
      case 0x258c: ctx.fillRect(x, y, Math.round(w / 2), h); return; // ▌
      case 0x2590: ctx.fillRect(x + Math.round(w / 2), y, w - Math.round(w / 2), h); return; // ▐
      case 0x2595: ctx.fillRect(x + w - Math.max(1, Math.round(w / 8)), y, Math.max(1, Math.round(w / 8)), h); return; // ▕
      case 0x2599: ctx.fillRect(x, y + cw, w, cw); ctx.fillRect(x, y, Math.round(w / 2), cw); return; // ▙
      case 0x259f: ctx.fillRect(x, y + cw, w, cw); ctx.fillRect(x + Math.round(w / 2), y, w - Math.round(w / 2), cw); return; // ▟
      case 0x2591: ctx.globalAlpha = 0.25; ctx.fillRect(x, y, w, h); ctx.globalAlpha = 1; return; // ░
    }
    if (c >= 0x2581 && c <= 0x2587) { // ▁ to ▇: lower eighths
      const k = Math.round((h * (c - 0x2580)) / 8);
      ctx.fillRect(x, y + h - k, w, k);
      return;
    }
    ctx.fillText(String.fromCodePoint(c), x + w / 2, y + h / 2 + h * 0.04);
  }

  // Repaint only the cells that changed since the last frame.
  function draw(ptr) {
    const f = new Uint32Array(e.memory.buffer, ptr, cols * rows * 3);
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const i = (y * cols + x) * 3;
        if (prev && prev[i] === f[i] && prev[i + 1] === f[i + 1] && prev[i + 2] === f[i + 2]) continue;
        cell(f[i], f[i + 1], f[i + 2], x * cw, y * 2 * cw);
      }
    }
    prev = f.slice();
  }

  // Fixed-rate simulation; if the page falls behind, run a few steps without
  // drawing so it drops frames instead of slowing down.
  function tick(t) {
    requestAnimationFrame(tick);
    const frame = 1000 / anims[cur].fps;
    acc += Math.min(t - last, 250);
    last = t;
    let ptr = 0, n = 0;
    while (acc >= frame && n < 6) {
      ptr = e.step();
      acc -= frame;
      n++;
    }
    if (n === 6) acc = 0;
    if (ptr) draw(ptr);
  }

  let hideTimer = 0;
  function showUi() {
    ui.classList.remove("hidden");
    repo.classList.remove("hidden");
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      if (!menu.hidden || repo.matches(":hover")) return;
      ui.classList.add("hidden");
      repo.classList.add("hidden");
    }, 2500);
  }

  const fromHash = () => anims.findIndex((a) => a.name === decodeURIComponent(location.hash.slice(1)));
  let first = anims.findIndex((a) => a.name === START);
  if (first < 0) first = fromHash();
  if (first < 0) first = Math.floor(Math.random() * anims.length);

  pick.addEventListener("change", () => { play(Number(pick.value)); pick.blur(); });
  addEventListener("hashchange", () => { const i = fromHash(); if (i >= 0 && i !== cur && !SINGLE) play(i); });
  addEventListener("mousemove", showUi);
  more.addEventListener("click", () => { toggleMenu(menu.hidden); if (menu.hidden) more.blur(); });
  menu.addEventListener("click", (ev) => { if (ev.target.closest("a")) { toggleMenu(false); ev.target.closest("a").blur(); } });
  addEventListener("pointerdown", (ev) => { if (!menu.hidden && !ui.contains(ev.target)) toggleMenu(false); });
  let resizeTimer = 0;
  addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => play(cur), 150); });
  addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && !menu.hidden) { toggleMenu(false); more.focus(); return; }
    if (ev.target === pick) return;
    // Enter and Space on the menu button and links activate them.
    if ((ev.key === "Enter" || ev.key === " ") && (ev.target === more || menu.contains(ev.target))) return;
    switch (ev.key) {
      case "Enter":
        play(SINGLE ? cur : (cur + 1 + Math.floor(Math.random() * (anims.length - 1))) % anims.length);
        break;
      case "ArrowUp": e.key(1); break;
      case "ArrowDown": e.key(2); break;
      case "w": case "W": e.key(5); break;
      case "a": case "A": e.key(3); break;
      case "s": case "S": e.key(6); break;
      case "d": case "D": e.key(4); break;
      case " ": e.key(7); break;
      case "+": case "=": cellCss = Math.min(24, cellCss + 1); play(cur); break;
      case "-": case "_": cellCss = Math.max(3, cellCss - 1); play(cur); break;
      case "f": case "F":
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen?.();
        break;
      default: return;
    }
    ev.preventDefault();
    showUi();
  });

  play(first);
  showUi();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
