[package]
name = "tanim"
version = "0.1.0"
edition = "2021"
description = "Procedural, endless terminal screensaver animations"
license = "MIT"
repository = "https://github.com/SantiagoSchez/tanim"
readme = "README.md"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
